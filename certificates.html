<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* Ensure the footer sticks to the bottom */
        html, body {
            height: 100%;
            margin: 0;
        }
        .wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
            display: none; /* Hide content initially until data is loaded */
        }
        .footer {
            background-color: #2563EB; /* Blue background */
            color: white; /* White text */
            padding: 10px 0;
            text-align: center;
            margin-top: auto; /* Push footer to the bottom */
        }
        .card {
            width: 400px;
            margin: 2rem;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .card-body {
            padding: 30px;
        }
        .card-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .card-text {
            text-align: center;
            text-align: left;
            font-size: 1rem;
            color: #555;
        }
        /* Loader Styles */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(144, 140, 140, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #2563EB; /* Match navbar blue */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Loader -->
        <div class="loader-container" id="loader">
            <div class="loader"></div>
        </div>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #2563EB;">
            <div class="container-fluid">
                <a class="navbar-brand text-white" href="#" style="font-weight: bold;">
                    <i class="fas fa-graduation-cap mr-2"></i> EduSpark
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link text-white" href="main.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="userProfile.html">User Profile</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="enrolledcourses.html">My Courses</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="payment.html">Payments</a></li>
                        <li class="nav-item"><a class="nav-link text-white active" href="#">Certificates</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="Saved.html">Saved Videos</a></li>
                    </ul>
                    <button id="Logout" class="btn btn-light">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="content container mt-5" id="main-content">
            <h2>Certificates</h2>
            <div id="certificates-list" class="d-flex flex-wrap justify-content-center"></div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>© 2023 EduSpark. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        // Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5iAUnK_5AP7ijrcQvlRfvCSfXrH9n6Ak",
            authDomain: "index-16f53.firebaseapp.com",
            projectId: "index-16f53",
            storageBucket: "index-16f53.firebasestorage.app",
            messagingSenderId: "171804052014",
            appId: "1:171804052014:web:c38d9d50835d551cafadbf",
            databaseURL: "https://index-16f53-default-rtdb.firebaseio.com/"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // DOM elements
        const loader = document.getElementById("loader");
        const content = document.getElementById("main-content");

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User is logged in:", user.uid);
                fetchCertificates(user.uid);
            } else {
                console.log("User is not logged in");
                loader.style.display = "none";
                window.location.href = "index.html";
            }
        });

        // Fetch certificates
        function fetchCertificates(userId) {
            const certificatesRef = ref(database, `users/${userId}/certificates`);

            onValue(certificatesRef, (snapshot) => {
                const certificatesData = snapshot.val();
                console.log("Certificates Data:", certificatesData);

                const certificatesList = document.getElementById('certificates-list');
                certificatesList.innerHTML = '';

                // Hide loader and show content
                loader.style.display = "none";
                content.style.display = "block";

                if (certificatesData) {
                    const uniqueCertificates = {};

                    // Filter duplicates
                    Object.keys(certificatesData).forEach((key) => {
                        const certificate = certificatesData[key];

                        // Ensure certificate has both courseTitle and studentName
                        if (certificate.courseTitle && certificate.studentName) {
                            const uniqueKey = `${certificate.courseTitle}-${certificate.studentName}`;

                            // Only add the certificate if it doesn't already exist
                            if (!uniqueCertificates[uniqueKey]) {
                                uniqueCertificates[uniqueKey] = certificate;
                            }
                        }
                    });

                    // Display unique certificates
                    Object.values(uniqueCertificates).forEach((certificate) => {
                        const issueDate = certificate.timestamp ? new Date(certificate.timestamp).toLocaleDateString() : "Unknown date";

                        const certificateCard = document.createElement("div");
                        certificateCard.classList.add("card");
                        certificateCard.innerHTML = `
                            <div class="card-body">
                                <h5 class="card-title">${certificate.courseTitle}</h5>
                                <p class="card-text">Issued To: ${certificate.studentName}</p>
                                <p class="card-text">Issued On: ${issueDate}</p>
                                <button class="btn btn-primary btn-view-certificate" onclick="viewCertificate('${certificate.courseTitle}', '${certificate.studentName}')">View Certificate</button>
                            </div>
                        `;

                        certificatesList.appendChild(certificateCard);
                    });
                } else {
                    certificatesList.innerHTML = '<p>No certificates found.</p>';
                }
            }, (error) => {
                console.error("Error fetching certificates:", error);
                // Hide loader and show content even on error
                loader.style.display = "none";
                content.style.display = "block";
                document.getElementById('certificates-list').innerHTML = '<p>Error loading certificates. Please try again later.</p>';
            });
        }

        // Logout functionality
        document.getElementById('Logout').addEventListener('click', () => {
            Swal.fire({
                title: 'Are you sure?',
                text: 'You are about to log out. Do you want to continue?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, log out!',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    signOut(auth).then(() => {
                        console.log("User logged out successfully");
                        window.location.href = "index.html";
                    }).catch((error) => {
                        console.error("Logout error:", error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Logout Failed',
                            text: 'An error occurred while logging out. Please try again.'
                        });
                    });
                }
            });
        });
    </script>

    <!-- Define viewCertificate in global scope -->
    <script>
        // View Certificate
        function viewCertificate(courseTitle, studentName) {
            window.location.href = `certificate.html?courseName=${encodeURIComponent(courseTitle)}&studentName=${encodeURIComponent(studentName)}`;
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
