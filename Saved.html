<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Videos</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
            display: none; /* Hide content initially */
        }
        .footer {
            background-color: #2563EB;
            color: white;
            padding: 10px 0;
            text-align: center;
            margin-top: auto;
        }
        .card {
            border: none;
            height: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .card-body {
            padding: 15px;
        }
        .card-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        /* Loader Styles */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(144, 140, 140, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #2563EB;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Video Modal Styles */
        .modal-video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
        }
        .modal-video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .modal-dialog {
            max-width: 800px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Loader -->
        <div class="loader-container" id="loader">
            <div class="loader"></div>
        </div>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #2563EB;">
            <div class="container-fluid">
                <a class="navbar-brand text-white" href="#" style="font-weight: bold;">
                    <i class="fas fa-graduation-cap mr-2"></i> EduSpark
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link text-white" href="main.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="userProfile.html">User Profile</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="enrolledcourses.html">My Courses</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="payment.html">Payments</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="certificates.html">Certificates</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="Saved.html">Saved Videos</a></li>
                    </ul>
                    <button id="Logout" class="btn btn-light">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="content container mt-5" id="main-content">
            <h2 class="mt-5">Saved Videos</h2>
            <div id="videos-list" class="row"></div>
        </div>

        <!-- Video Modal -->
        <div class="modal fade" id="videoModal" tabindex="-1" aria-labelledby="videoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="videoModalLabel">Video Player</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="modal-video-container">
                            <iframe id="modalVideoPlayer" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>© 2023 EduSpark. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        // Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-database.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5iAUnK_5AP7ijrcQvlRfvCSfXrH9n6Ak",
            authDomain: "index-16f53.firebaseapp.com",
            projectId: "index-16f53",
            storageBucket: "index-16f53.firebasestorage.app",
            messagingSenderId: "171804052014",
            appId: "1:171804052014:web:c38d9d50835d551cafadbf",
            databaseURL: "https://index-16f53-default-rtdb.firebaseio.com/"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // Define loader and content elements
        const loader = document.getElementById("loader");
        const content = document.getElementById("main-content");
        console.log("Content element:", content); // Debug log to verify

        // Initialize Bootstrap modal
        const videoModal = new bootstrap.Modal(document.getElementById('videoModal'));

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User is logged in:", user.uid);
                fetchSavedVideos(user.uid);
            } else {
                console.log("User is not logged in");
                window.location.href = "login.html";
            }
        });

        // Fetch saved videos
        function fetchSavedVideos(userId) {
            const videosRef = ref(database, `users/${userId}/watchLater`);

            onValue(videosRef, (snapshot) => {
                const videosData = snapshot.val();
                console.log("Saved Videos Data:", videosData);

                const videosList = document.getElementById('videos-list');
                videosList.innerHTML = '';

                // Hide loader and show content with minimum display time
                setTimeout(() => {
                    loader.style.display = "none";
                    content.style.display = "block";
                }, 500); // Minimum 500ms for loader

                if (videosData) {
                    Object.keys(videosData).forEach((key) => {
                        const video = videosData[key];

                        const description = video.description ? video.description : "No description available";
                        const savedDate = video.timestamp ? new Date(video.timestamp).toLocaleDateString() : "Unknown date";

                        // Convert YouTube URL to embeddable format
                        let embedUrl = video.url.replace("watch?v=", "embed/");

                        const videoCard = document.createElement("div");
                        videoCard.classList.add("col-md-6", "mb-4");
                        videoCard.innerHTML = `
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">${video.courseTitle}</h5>
                                    <p class="card-text">Description: ${video.title}</p>
                                    <p class="card-text">Saved On: ${savedDate}</p>
                                    <button class="btn btn-primary watch-video" data-url="${embedUrl}">Watch Video</button>
                                </div>
                            </div>
                        `;

                        videosList.appendChild(videoCard);

                        // Add event listener to button
                        videoCard.querySelector(".watch-video").addEventListener("click", function () {
                            const videoUrl = this.getAttribute("data-url");
                            document.getElementById('modalVideoPlayer').src = videoUrl;
                            videoModal.show();
                        });
                    });
                } else {
                    videosList.innerHTML = '<p>No saved videos found.</p>';
                }
            }, (error) => {
                console.error("Error fetching saved videos:", error);
                // Hide loader and show content even on error
                setTimeout(() => {
                    loader.style.display = "none";
                    content.style.display = "block";
                    document.getElementById('videos-list').innerHTML = '<p>Error loading videos. Please try again.</p>';
                }, 500); // Minimum 500ms for loader
            });
        }

        // Clear video source when modal is closed to stop playback
        document.getElementById('videoModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('modalVideoPlayer').src = '';
        });

        // Add event listener to the logout button
        document.getElementById('Logout').addEventListener('click', () => {
            // Show SweetAlert2 confirmation dialog
            Swal.fire({
                title: 'Are you sure?',
                text: 'You are about to log out. Do you want to continue?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, log out!',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    // If user confirms, proceed with logout
                    signOut(auth).then(() => {
                        console.log("User logged out successfully");
                        // Redirect to the home page or login page
                        window.location.href = "index.html";
                    }).catch((error) => {
                        console.error("Logout error:", error);
                        // Show error message if logout fails
                        Swal.fire({
                            icon: 'error',
                            title: 'Logout Failed',
                            text: 'An error occurred while logging out. Please try again.'
                        });
                    });
                }
            });
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
