<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Tailwind CSS
    <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom Styles -->
    <style>
        .footer {
            background-color: #2563EB; /* Blue-600 */
            color: white;
            padding: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .container { margin-top: 80px; }
        .video-item { margin-bottom: 10px; }
        .video-player { margin-top: 20px; }
        iframe, video { width: 100%; height: 350px; }
        .progress { margin-top: 20px; height: 30px; }
        .progress-bar { transition: width 0.5s ease; }
        #generate-certificate { margin-top: 20px; }
        .navbar { height: 60px; }
        .btn-back { background-color: #ffc107; color: white; }
        .course-title { text-align: center; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2563EB;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="#" style="font-weight: bold;">
                <i class="fas fa-graduation-cap mr-2"></i> EduSpark
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="main.html"><span>Home</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="certificates.html"><span>Certificates</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="Saved.html"><span>Saved Videos</span></a>
                    </li>
                </ul>
                <div class="auth-buttons d-flex">
                    <button id="Logout" class="btn btn-light">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1 class="course-title" style="font-size: 2rem; font-weight: bolder;" id="course-title"></h1>
        <div id="video-player" class="video-player"></div>
        <div class="progress">
            <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>
        <button id="generate-certificate" class="btn btn-success mb-2" disabled>Generate Certificate</button>
        <div id="video-list" class="list-group"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2023 EduSpark. All rights reserved.</p>
    </footer>

    <!-- SweetAlert JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootstrap JS (with Popper.js) -->

    <!-- Custom JS -->
    <script src="single-course.js"></script>
